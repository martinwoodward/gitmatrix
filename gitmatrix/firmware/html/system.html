<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>System · GitMatrix</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
<h1>System</h1>
<section>
  <h2>About</h2>
  <dl class="facts" id="facts"></dl>
  <div class="actions"><button class="danger" id="reboot">Reboot</button></div>
</section>
<section>
  <h2>Plugin problems</h2>
  <ul class="list" id="problems"></ul>
</section>
<section>
  <div class="row"><h2 class="grow">Log</h2><button id="refresh-log">Refresh</button></div>
  <pre class="log" id="log"></pre>
</section>
<section>
  <h2>Developer</h2>
  <p class="muted">Try the <a href="https://github.com/martinwoodward/gitmatrix/blob/main/docs/gitmatrix/api.md">REST API</a> from here. Paths are under /api/v1.</p>
  <div class="row">
    <select id="dev-method"><option>GET</option><option>POST</option><option>DELETE</option></select>
    <input type="text" class="grow mono" id="dev-path" value="/status" aria-label="Path">
    <button id="dev-send">Send</button>
  </div>
  <textarea id="dev-body" class="mono" rows="3" placeholder='JSON body, e.g. {"text": "hello"}' aria-label="Body"></textarea>
  <pre class="log" id="dev-out"></pre>
  <div class="row"><h2 class="grow">Live events</h2><button id="dev-watch">Watch</button></div>
  <pre class="log" id="dev-events"></pre>
</section>
</main>
<script src="/static/app.js"></script>
<script>
function render(s) {
  const mem = s.memory ? `${fmtBytes(s.memory.free)} free of ${fmtBytes(s.memory.free + s.memory.used)}` : "?";
  const flash = s.flash ? `${fmtBytes(s.flash.free)} free of ${fmtBytes(s.flash.total)}` : "?";
  $("#facts").replaceChildren(...[
    ["GitMatrix", s.version], ["MicroPython", s.micropython], ["Up for", s.uptime_ms != null ? fmtAge(s.uptime_ms) : "?"],
    ["Memory", mem], ["Flash", flash], ["Safe mode", s.safe_mode ? "ON: plugins are not running" : "Off"],
  ].flatMap(([k, v]) => [el("dt", {}, k), el("dd", { class: k === "Safe mode" && s.safe_mode ? "bad" : "" }, v)]));
  const items = [];
  for (const [name, reason] of Object.entries(s.quarantined)) {
    items.push(el("li", {}, el("div", { class: "grow" }, el("b", {}, name), " quarantined: ", reason),
      el("button", { onclick: async () => { await attempt(() => api(`/plugins/${name}/unquarantine`, {}), "Un-quarantined"); load(); } }, "Un-quarantine")));
  }
  for (const e of s.errors.slice(-10).reverse()) {
    items.push(el("li", {}, el("div", { class: "grow mono" }, `${e.plugin}.${e.hook}: ${e.error}`)));
  }
  $("#problems").replaceChildren(...(items.length ? items : [el("li", { class: "muted" }, "None. Everything is behaving.")]));
}
async function logs() {
  const l = await attempt(() => api("/system/logs"));
  if (l) $("#log").textContent = l.lines.map((x) => `${fmtAge(x.age_ms).padStart(7)} ago  ${x.text}`).join("\n") || "(empty)";
}
const load = () => attempt(() => api("/system")).then((s) => s && render(s));
$("#reboot").onclick = async () => { if (confirm("Reboot GitMatrix?") && await attempt(() => api("/system/reboot", {}))) rebooting(); };
$("#refresh-log").onclick = logs;
$("#dev-send").onclick = async () => {
  const method = $("#dev-method").value;
  const opts = { method, credentials: "same-origin", headers: {} };
  const text = $("#dev-body").value.trim();
  if (text && method !== "GET") {
    try { JSON.parse(text); } catch (e) { toast("Body is not valid JSON", true); return; }
    opts.headers["Content-Type"] = "application/json";
    opts.body = text;
  }
  const path = $("#dev-path").value.trim().replace(/^\/api\/v1/, "");
  $("#dev-out").textContent = "...";
  try {
    const res = await fetch("/api/v1" + (path.startsWith("/") ? path : "/" + path), opts);
    let out = await res.text();
    try { out = JSON.stringify(JSON.parse(out), null, 2); } catch (e) { /* not JSON */ }
    $("#dev-out").textContent = `${res.status} ${res.statusText}\n${out}`;
  } catch (e) {
    $("#dev-out").textContent = e.message;
  }
};
// one long-poll at a time (the device allows two); stops when the page goes
let watching = false;
async function watch() {
  let since = null;
  const lines = [];
  while (watching) {
    try {
      const q = since === null ? "" : `?since=${since}&timeout=25`;
      const r = await api("/events" + q);
      if (r.dropped) lines.push(`(${r.dropped} events missed)`);
      if (r.reset) lines.push("(device restarted)");
      for (const e of r.events) {
        const { seq, type, age_ms, ...rest } = e;
        lines.push(`#${seq} ${type} ${JSON.stringify(rest)}`);
      }
      since = r.next;
      $("#dev-events").textContent = lines.slice(-50).reverse().join("\n") || "(waiting for events)";
    } catch (e) {
      $("#dev-events").textContent = e.message;
      await new Promise((ok) => setTimeout(ok, (e.data && e.data.retry_ms) || 3000));
    }
  }
}
$("#dev-watch").onclick = () => {
  watching = !watching;
  $("#dev-watch").textContent = watching ? "Stop" : "Watch";
  if (watching) watch();
};
addEventListener("pagehide", () => { watching = false; });
load();
logs();
</script>
</body>
</html>
