<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home · GitMatrix</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<main>
<h1>Home</h1>
<section>
  <h2>Now showing</h2>
  <div class="row">
    <button id="prev" aria-label="Previous plugin">&#8592;</button>
    <div class="grow big" id="now">…</div>
    <button id="next" aria-label="Next plugin">&#8594;</button>
  </div>
</section>
<section>
  <h2>Plugins</h2>
  <p class="muted">Enabled plugins rotate in this order. Use ↑/↓ to reorder.</p>
  <ul class="list" id="plugins"></ul>
  <label for="delay">Show each plugin for (seconds, 0 = don't rotate)</label>
  <div class="row"><input class="grow" type="number" id="delay" min="0" max="86400"><button id="save-delay">Save</button></div>
</section>
</main>
<script src="/static/app.js"></script>
<script>
let order = [];
function render(data) {
  $("#now").textContent = data.now_showing ? data.now_showing.title : "Nothing";
  if (document.activeElement !== $("#delay")) $("#delay").value = data.delay;
  order = data.plugins.map((p) => p.name);
  const ul = $("#plugins");
  ul.replaceChildren();
  if (!data.plugins.length) ul.append(el("li", { class: "muted" }, "No plugins installed yet."));
  data.plugins.forEach((p, i) => {
    const toggle = el("input", { type: "checkbox", checked: p.enabled, disabled: p.quarantined, "aria-label": "Enabled",
      onchange: () => act(`/plugins/${p.name}/${toggle.checked ? "enable" : "disable"}`) });
    const note = p.quarantined ? el("div", { class: "bad" }, "Quarantined: " + (p.reason || "too many errors"))
      : p.last_error ? el("div", { class: "muted mono" }, p.last_error) : null;
    ul.append(el("li", { class: p.current ? "picked" : "" }, toggle,
      el("div", { class: "grow" }, el("div", {}, p.title, p.current ? " (showing)" : ""), note),
      p.quarantined ? el("button", { onclick: () => act(`/plugins/${p.name}/unquarantine`) }, "Un-quarantine")
        : el("button", { disabled: !p.enabled, onclick: () => act(`/plugins/${p.name}/show`) }, "Show now"),
      el("button", { "aria-label": "Move up", disabled: i === 0, onclick: () => move(i, -1) }, "↑"),
      el("button", { "aria-label": "Move down", disabled: i === order.length - 1, onclick: () => move(i, 1) }, "↓")));
  });
}
async function refresh() { const d = await attempt(() => api("/plugins")); if (d) render(d); }
async function act(path) { await attempt(() => api(path, {})); refresh(); }
async function move(i, by) {
  const next = order.slice();
  [next[i], next[i + by]] = [next[i + by], next[i]];
  const d = await attempt(() => api("/plugins/order", { order: next }));
  if (d) render(d);
}
$("#prev").onclick = () => act("/plugins/prev");
$("#next").onclick = () => act("/plugins/next");
$("#save-delay").onclick = () => attempt(() => api("/settings", { delay: Number($("#delay").value) }), "Saved");
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
